# REACH's own lint and test configuration. It shares nothing with the other
# products in this repository — run both from this directory.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# pycodestyle errors plus pyflakes: genuine defects (undefined names, unused
# imports, shadowed variables) without imposing a formatter. Line length is
# deliberately not enforced — this code runs to ~120 characters by design.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The adapter package re-exports its submodules for the ADAPTERS registry.
"reach/providers/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
